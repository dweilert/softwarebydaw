# Moves the pinned actions in deploy.yml deliberately rather than by accident.
#
# WHY THIS EXISTS ALONGSIDE SHA PINS, since the two look like they pull in
# opposite directions. Pinning to a commit removes the risk that a tag is MOVED
# under us. But a pin with nobody watching it is a dependency frozen at whatever
# it had the day it was pinned, and this workflow assumes an AWS role and
# republishes the site that carries the installer download links. The pin makes
# a change visible; this makes the change happen. Neither is sufficient alone.
#
# Grouped and monthly, matching the RP repository's config for the same reason:
# a single maintainer plus a stream of individual PRs nobody has time to read is
# indistinguishable from no scanning at all, and worse, it teaches you to close
# them unread.
#
# Note the two actions here are behind RP's — this repo pins checkout v4 while
# RP is on v7. That gap is deliberate for now: pinning was done without changing
# versions, so the pin itself could not break a deploy nobody can rehearse. The
# first grouped PR from this config is where the major bump gets read on its own.
version: 2

updates:
  # Dependabot rewrites the SHA *and* the trailing `# v4.4.0` comment together,
  # so the pin stays readable to a person.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
