name: Deploy to Amplify

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  AMPLIFY_APP_ID: d2s5q12tq2w0ac
  AMPLIFY_BRANCH: dev1442

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # ACTIONS ARE PINNED BY COMMIT SHA, NOT BY TAG.
      #
      # A tag is a movable label. Whoever controls the action's repository can
      # repoint v4 at different code, and every workflow that trusts the tag
      # runs it on the next push with nothing to see in any diff. A SHA is the
      # content, so an upgrade has to arrive as a commit somebody approved.
      #
      # It matters MORE here than the "marketing site" framing suggests. This
      # workflow assumes an AWS role and republishes the whole site, and the
      # site is where version.json and the installer download links live — the
      # channel the installed app and every prospective user reads to find out
      # what to download. Code that runs here can point people at a different
      # binary. That is the same class of risk the RP release pipeline pins
      # against, arriving by a quieter road.
      #
      # .github/dependabot.yml is the other half: a pin nobody moves is a
      # dependency frozen at whatever it had the day it was pinned.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify public knowledge bundle
        run: node scripts/verify-public-knowledge.mjs

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::785502284517:role/softwarebydaw-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Keep the validation report URL reader-friendly
        run: |
          CURRENT_RULES=$(aws amplify get-app \
            --app-id "$AMPLIFY_APP_ID" \
            --region "$AWS_REGION" \
            --query 'app.customRules' \
            --output json)
          UPDATED_RULES=$(jq -c '
            map(select(.source != "/public-knowledge/data/validation-report.md")
              | if .condition == null then del(.condition) else . end)
            + [{"source":"/public-knowledge/data/validation-report.md","status":"301","target":"/math-proof/report.html"}]
          ' <<< "$CURRENT_RULES")
          aws amplify update-app \
            --app-id "$AMPLIFY_APP_ID" \
            --region "$AWS_REGION" \
            --custom-rules "$UPDATED_RULES" >/dev/null

      - name: Zip site contents
        run: |
          cd src
          zip -r -q ../site.zip . -x "*.zip"

      - name: Create Amplify deployment
        id: create
        run: |
          RESPONSE=$(aws amplify create-deployment \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH")
          echo "$RESPONSE" > deployment.json
          JOB_ID=$(node -pe "require('./deployment.json').jobId")
          UPLOAD_URL=$(node -pe "require('./deployment.json').zipUploadUrl")
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
          echo "upload_url=$UPLOAD_URL" >> "$GITHUB_OUTPUT"

      - name: Upload site archive
        run: |
          curl -sS -X PUT "${{ steps.create.outputs.upload_url }}" \
            --upload-file site.zip

      - name: Start deployment
        run: |
          aws amplify start-deployment \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH" \
            --job-id "${{ steps.create.outputs.job_id }}"

      - name: Wait for deployment to finish
        run: |
          JOB_ID="${{ steps.create.outputs.job_id }}"
          for i in $(seq 1 30); do
            STATUS=$(aws amplify get-job \
              --app-id "$AMPLIFY_APP_ID" \
              --branch-name "$AMPLIFY_BRANCH" \
              --job-id "$JOB_ID" \
              --query 'job.summary.status' --output text)
            echo "Status: $STATUS"
            if [ "$STATUS" = "SUCCEED" ]; then
              echo "Deployment succeeded."
              exit 0
            fi
            if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CANCELLED" ]; then
              echo "Deployment failed with status $STATUS"
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for deployment to finish"
          exit 1
